# Render Blueprint — deploy the Socket.io backend (WebSockets required).
# Dashboard: New → Blueprint → connect this repo, or use the Render button in the README.
# After deploy, set CORS_ORIGIN to your Vercel URL and point Vercel VITE_SOCKET_URL here.

services:
  - type: web
    name: quizmebaby-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
